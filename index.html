const grid = document.getElementById('grid');
const loadMoreBtn = document.getElementById('loadMore');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbInquiry = document.getElementById('lbInquiry');
const lbClose = document.getElementById('lbClose');

let rendered = 0;
const BATCH = 50;

function renderBatch() {
  const slice = imgList.slice(rendered, rendered + BATCH);
  slice.forEach((url, i) => {
    const idx = rendered + i;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img loading="lazy" src="${url}" alt="Product ${idx + 1}" onclick="openLightbox('${url}')">
      <div class="name">Product ${idx + 1}</div>
      <a class="inquiry" href="${waLink}" target="_blank" rel="noopener">Inquiry</a>
    `;
    grid.appendChild(card);
  });
  rendered += slice.length;
  if (rendered >= imgList.length) {
    loadMoreBtn.style.display = 'none';
  }
}

function openLightbox(url) {
  lbImg.src = url;
  lbInquiry.href = waLink;
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }

lbClose.onclick = closeLightbox;
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
loadMoreBtn.onclick = renderBatch;

renderBatch();
</script>
