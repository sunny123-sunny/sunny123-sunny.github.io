<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Wholesale Products</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, "Segoe UI", sans-serif; background: #f7f8fa; color: #222; }

  /* 顶部联系条 */
  .top-bar {
    background: #0a7d3b;
    color: #fff;
    font-size: 14px;
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .top-bar a { color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .top-bar a:hover { text-decoration: underline; }

  header { background: #fff; padding: 18px 16px; border-bottom: 1px solid #e5e5e5; }
  header h1 { font-size: 22px; color: #0a7d3b; }
  header p { font-size: 13px; color: #666; margin-top: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px 16px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    height: auto;        /* 原比例，不裁剪 */
    display: block;
    border-radius: 4px;
    cursor: zoom-in;
    background: #f0f0f0;
  }
  .card .name { font-size: 14px; margin-top: 8px; color: #333; }
  .card .inquiry {
    margin-top: 8px;
    font-size: 13px;
    color: #0a7d3b;
    border: 1px solid #0a7d3b;
    border-radius: 4px;
    padding: 5px 8px;
    text-align: center;
    cursor: pointer;
    text-decoration: none;
    display: block;
  }
  .card .inquiry:hover { background: #0a7d3b; color: #fff; }

  .load-more-wrap { text-align: center; padding: 20px; }
  .load-more {
    padding: 10px 28px;
    background: #0a7d3b;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .load-more:disabled { background: #aaa; cursor: default; }

  /* 放大弹窗 */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
  }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 86vh; border-radius: 6px; background:#fff; }
  .lightbox .lb-inquiry {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a7d3b;
    color: #fff;
    padding: 10px 22px;
    border-radius: 6px;
    font-size: 14px;
    text-decoration: none;
  }
  .lightbox .close {
    position: absolute; top: 18px; right: 24px;
    color: #fff; font-size: 30px; cursor: pointer; line-height: 1;
  }

  /* 底部联系区 */
  footer {
    background: #fff;
    border-top: 1px solid #e5e5e5;
    padding: 28px 16px;
    text-align: center;
    font-size: 14px;
    color: #444;
    line-height: 2;
  }
  footer a { color: #0a7d3b; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<!-- 顶部联系条 -->
<div class="top-bar">
  <a href="https://wa.me/8618105791688?text=Hello%2C%20I%27m%20interested%20in%20your%20wholesale%20products." target="_blank" rel="noopener">
    💬 WhatsApp: +86 181 0579 1688
  </a>
  <a href="mailto:sales@sunnywholesale.com">📧 sales@sunnywholesale.com</a>
  <a href="tel:+8618105791688">📞 +86 181 0579 1688</a>
</div>

<header>
  <h1>Sunny Wholesale Products</h1>
  <p>Home Appliance Wholesale · Factory Direct</p>
</header>

<div class="grid" id="grid"></div>

<div class="load-more-wrap">
  <button class="load-more" id="loadMore">Load more</button>
</div>

<!-- 放大弹窗 -->
<div class="lightbox" id="lightbox">
  <span class="close" id="lbClose">&times;</span>
  <img id="lbImg" src="" alt="product">
  <a class="lb-inquiry" id="lbInquiry" href="#" target="_blank" rel="noopener">💬 Inquiry on WhatsApp</a>
</div>

<!-- 底部联系区 -->
<footer>
  <p>📍 Sunny Wholesale Products</p>
  <p>
    💬 WhatsApp:
    <a href="https://wa.me/8618105791688?text=Hello%2C%20I%27m%20interested%20in%20your%20wholesale%20products." target="_blank" rel="noopener">
      +86 181 0579 1688
    </a>
  </p>
  <p>📧 <a href="mailto:sales@sunnywholesale.com">sales@sunnywholesale.com</a></p>
  <p>📞 <a href="tel:+8618105791688">+86 181 0579 1688</a></p>
</footer>

<script>
/* ===== 联系配置（以后只改这里） ===== */
const CONTACT = {
  wa: '8618105791688',
  waText: "Hello, I'm interested in your wholesale products.",
  email: 'sales@sunnywholesale.com'
};
const waLink = `https://wa.me/${CONTACT.wa}?text=${encodeURIComponent(CONTACT.waText)}`;

/* ===== 你的图片数组（示例2张，把原来470条贴回来即可） ===== */
const imgList = [
  "https://i.ibb.co/0R0PcB0h/362.png",
  "https://i.ibb.co/0V2CktS1/316.png"
  // ... 其余 468 条保持原样贴在这里
];

/* ===== 渲染逻辑 ===== */
const grid = document.getElementById('grid');
const loadMoreBtn = document.getElementById('loadMore');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbInquiry = document.getElementById('lbInquiry');
const lbClose = document.getElementById('lbClose');

let rendered = 0;
const BATCH = 50;

function renderBatch() {
  const slice = imgList.slice(rendered, rendered + BATCH);
  slice.forEach((url, i) => {
    const idx = rendered + i;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img loading="lazy" src="${url}" alt="Product ${idx + 1}" onclick="openLightbox('${url}')">
      <div class="name">Product ${idx + 1}</div>
      <a class="inquiry" href="${waLink}" target="_blank" rel="noopener">Inquiry</a>
    `;
    grid.appendChild(card);
  });
  rendered += slice.length;
  if (rendered >= imgList.length) {
    loadMoreBtn.style.display = 'none';
  }
}

function openLightbox(url) {
  lbImg.src = url;
  lbInquiry.href = waLink;
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }

lbClose.onclick = closeLightbox;
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
loadMoreBtn.onclick = renderBatch;

renderBatch();
</script>
</body>
</html>
