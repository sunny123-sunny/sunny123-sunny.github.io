<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Wholesale Products</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial;padding:20px;max-width:1200px;margin:0 auto;}
h1{text-align:center;margin-bottom:30px;color:#222;}
.product-grid{display:grid;grid-template-columns: repeat(auto-fill,minmax(260px,1fr));gap:24px;}
.product-card{border:1px solid #ddd;border-radius:10px;overflow:hidden;padding:16px;}
.product-card img{width:100%;max-height:420px;object-fit:contain;background:#f5f5f5;margin-bottom:12px;}
.product-card h3{margin-bottom:8px;}
.price{color:#d03030;font-weight:bold;font-size:18px;}
.inquiry{margin-top:12px;background:#2563eb;color:white;padding:8px 14px;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<h1>Our Wholesale Products</h1>
<p style="text-align:center;max-width:800px;margin:0 auto 40px auto;font-size:16px;">
We are a professional supplier of home appliances. We provide high-quality products with competitive price. Welcome to send inquiry for catalog and details.
</p>
<div class="product-grid">
<div class="product-card">
<img src="粘贴你的i.ibb.co图片直链在这里" alt="kettle">
<h3>kettle</h3>
<p class="price">Price: $1088</p>
<p>MOQ: 200 PCS</p>
<p>8L 304 stainless steel black</p>
<button class="inquiry">Inquiry Us</button>
</div>

</body>
</html>
