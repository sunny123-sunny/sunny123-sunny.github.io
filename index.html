/* ==========================================================
   3. STATE
   ========================================================== */
const grid = document.getElementById('grid');
const loadMoreBtn = document.getElementById('loadMore');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbInquiry = document.getElementById('lbInquiry');
const lbInfo = document.getElementById('lbInfo');
const lbClose = document.getElementById('lbClose');
const searchInput = document.getElementById('searchInput');
const toast = document.getElementById('toast');

let rendered = 0;
const BATCH = 30;          // cards per load
const FIRST_BATCH = 20;    // first paint
let currentCat = 'all';
let keyword = '';

function getView(){
  return products.filter(p =>
    (currentCat === 'all' || p.cat === currentCat) &&
    (keyword === '' || String(p.no).includes(keyword) || p.name.toLowerCase().includes(keyword))
  );
}

/* ==========================================================
   4. RENDER
   ========================================================== */
function waLinkFor(no){
  const text = I18N[LANG].wa_text.replace('{no}', no);
  return `https://wa.me/${CONTACT.wa}?text=${encodeURIComponent(text)}`;
}

function cardHTML(p){
  return `
    <div class="card">
      <img loading="lazy" src="${p.img}" alt="${p.name}" onclick="openLightbox(${p.no})">
      <div class="name">${p.name}</div>
      <div class="meta">#${p.no} · ${I18N[LANG]['cat_'+p.cat] || p.cat}</div>
      <a class="inquiry" href="${waLinkFor(p.no)}" target="_blank" rel="noopener" onclick="trackInquiry(${p.no})">${I18N[LANG].inquire_btn}</a>
    </div>`;
}

function renderBatch(){
  const view = getView();
  const remaining = view.length - rendered;
  if (remaining <= 0){ loadMoreBtn.style.display = 'none'; return; }

  const limit = rendered === 0 ? FIRST_BATCH : BATCH;
  const slice = view.slice(rendered, rendered + limit);

  const frag = document.createDocumentFragment();
  slice.forEach(p => {
    const div = document.createElement('div');
    div.innerHTML = cardHTML(p).trim();
    frag.appendChild(div.firstChild);
  });
  grid.appendChild(frag);
  rendered += slice.length;

  if (rendered >= view.length){
    loadMoreBtn.style.display = 'none';
  } else {
    loadMoreBtn.style.display = 'inline-block';
  }

  if (view.length === 0){
    if (!document.getElementById('noResult')){
      const div = document.createElement('div');
      div.className = 'no-result';
      div.id = 'noResult';
      div.textContent = I18N[LANG].no_result;
      grid.appendChild(div);
    }
  } else {
    document.getElementById('noResult')?.remove();
  }
}

function resetGrid(){
  grid.innerHTML = '';
  rendered = 0;
  loadMoreBtn.style.display = 'inline-block';
  renderBatch();
}

/* ==========================================================
   5. LIGHTBOX
   ========================================================== */
function openLightbox(no){
  const p = products.find(x => x.no === no);
  if (!p) return;
  lbImg.src = p.img;
  lbImg.alt = p.name;
  lbInfo.textContent = `${p.name}  ·  #${p.no}`;
  lbInquiry.href = waLinkFor(p.no);
  lightbox.classList.add('active');
  trackInquiry(p.no);
}
function closeLightbox(){ lightbox.classList.remove('active'); }

lbClose.onclick = closeLightbox;
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

/* ==========================================================
   6. FILTERS & SEARCH
   ========================================================== */
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  resetGrid();
});

let searchTimer;
searchInput.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    keyword = e.target.value.trim().toLowerCase();
    resetGrid();
  }, 200);
});

loadMoreBtn.onclick = () => {
  loadMoreBtn.classList.add('loading');
  loadMoreBtn.disabled = true;
  setTimeout(() => {
    renderBatch();
    loadMoreBtn.classList.remove('loading');
    loadMoreBtn.disabled = false;
  }, 400);
};

/* ==========================================================
   7. I18N SWITCHER
   ========================================================== */
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (I18N[LANG][key]) el.textContent = I18N[LANG][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    const key = el.dataset.i18nPh;
    if (I18N[LANG][key]) el.placeholder = I18N[LANG][key];
  });
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  resetGrid();
}
document.getElementById('langEn').onclick = () => setLang('en');
document.getElementById('langZh').onclick = () => setLang('zh');
function setLang(l){
  LANG = l;
  document.getElementById('langEn').classList.toggle('active', l === 'en');
  document.getElementById('langZh').classList.toggle('active', l === 'zh');
  applyLang();
}

/* ==========================================================
   8. ANALYTICS HELPERS
   ========================================================== */
function trackInquiry(no){
  if (typeof gtag === 'function') gtag('event', 'inquiry', { product_no: no });
  if (typeof fbq === 'function') fbq('track', 'Contact');
}

/* ==========================================================
   9. INIT
   ========================================================== */
applyLang();
</script>
